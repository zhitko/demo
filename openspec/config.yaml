schema: spec-driven
skillsScope: project

context: |
  Прототип для лекции: одна русская страница без бэкенда. Пользователь — руководитель проекта после созвона.
  Входит только узкий сценарий: загрузка готового .txt, кнопка «Сделать протокол», три блока (Решения, Задачи с ответственными, Открытые вопросы), скачивание UTF-8.
  Не входит: распознавание речи, логин, история, календарь, трекер, правка протокола, мобильная версия, напоминания, обработка ошибок.
  Учебная расшифровка — samples/transcript-demo.txt. Эталон трёх решений, двух задач и одного вопроса — в docs/requirements.md. Для этого файла заглушка без сети обязана вернуть эталон дословно.
  Открытые вопросы спецификации (минуты ручного протокола, лимит страниц, поведение при пустом файле) не закрывать выдуманными числами.
  Сценарии пишите с метками WHEN и THEN. Текст сценария — по-русски, в смысле «когда… тогда…».

rules:
  proposal:
    - "Пишите по-русски."
    - "Явно перечислите, что не входит в изменение."
    - "Не добавляйте возможности из списка «не входит»."
  specs:
    - "Нормативные слова — SHALL или MUST."
    - "Каждый сценарий: метки WHEN и THEN, формулировка по-русски."
    - "Не выдумывайте поведение для пустого файла и лимит страниц: это открытые вопросы."
  design:
    - "Без бэкенда и без обязательной сети. Живая модель только за флагом, выключенным по умолчанию."
  tasks:
    - "У каждой задачи есть способ проверки."
    - "Человек утверждает tasks.md до реализации."

operations:
  apply:
    guidance:
      - "Реализуйте только отмеченные задачи. Не добавляйте логин, историю, правку и распознавание речи."
  archive:
    guidance:
      - "Перед архивом убедитесь, что учебная расшифровка по-прежнему даёт эталон из docs/requirements.md."
